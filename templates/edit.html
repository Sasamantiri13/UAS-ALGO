{% extends 'base.html' %}
{% block content %}
<div class="header-action">
    <h1>Edit Mahasiswa ({{ student.nim }})</h1>
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Batal</a>
</div>

<div class="glass-card max-w-lg">
    <form method="POST" action="{{ url_for('edit', nim=student.nim) }}">
        <div class="form-group">
            <label>NIM</label>
            <input type="text" value="{{ student.nim }}" disabled class="disabled-input">
            <small class="text-muted">NIM tidak dapat diubah</small>
        </div>
        
        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" name="nama" value="{{ student.nama }}" minlength="2" maxlength="50">
        </div>
        
        <div class="form-group">
            <label>Jurusan</label>
            <input type="text" name="jurusan" value="{{ student.jurusan }}" minlength="2" maxlength="50">
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>Semester</label>
                <input type="number" name="semester" value="{{ student.semester }}" min="1" max="14">
            </div>
            
            <div class="form-group">
                <label>IPK (0.00 - 4.00)</label>
                <input type="number" name="ipk" value="{{ "%.2f"|format(student.ipk) }}" step="0.01" min="0" max="4">
            </div>
        </div>
        
        <div class="form-group">
            <label>Status</label>
            <select name="status">
                <option value="aktif" {% if student.status == 'Aktif' %}selected{% endif %}>Aktif</option>
                <option value="non-aktif" {% if student.status == 'Non-Aktif' %}selected{% endif %}>Non-Aktif</option>
            </select>
        </div>
        
        <button type="submit" class="btn btn-primary mt-3">Update Data</button>
    </form>
</div>
{% endblock %}
